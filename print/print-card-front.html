<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ead1e2">
<title>Wonderworks — QR-картка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/card.css">
<style>
@media print {
  .page-shell {
    background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bottom) 100%);
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .brand__name { font-weight: 400; letter-spacing: -0.6px; }
  .brand__subtitle { font-size: 6mm; }
}
</style>
</head>
<body>
<main class="page-stage">
  <article class="page-shell exhibition-page" aria-label="Wonderworks Devon Rex">
    <header class="brand">
      <div class="brand__logo-wrap">
        <img class="brand__logo" src="../assets/img/logo-approved-v3.webp" width="700" height="434" alt="Devon Rex Wonderworks">
      </div>
      <h1 class="brand__name">Wonderworks</h1>
      <p class="brand__subtitle">Розплідник породи <span lang="en">Devon Rex</span></p>
    </header>
    <div class="exhibition-content">
      <section class="card-qr" aria-label="QR-код Wonderworks"><img src="../qr/wonderworks-qr.svg" width="820" height="820" alt="QR-код Wonderworks"></section>
      <section class="card-socials" aria-label="Соціальні мережі Wonderworks">
        <div class="card-social"><img src="../assets/icons/instagram.svg" alt=""><strong>Instagram</strong><span>@lenasorokina72</span></div>
        <div class="card-social"><img src="../assets/icons/tiktok.svg" alt=""><strong>TikTok</strong><span>@lena_sorokina72</span></div>
        <div class="card-social"><img src="../assets/icons/facebook.svg" alt=""><strong>Facebook</strong><span>lena.sorokina72</span></div>
      </section>
    </div>
  </article>
</main>
</body>
</html>
